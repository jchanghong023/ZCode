# 仓库固定 Bun 版本；pnpm 版本只由 package.json 的 packageManager 声明。
# 工程脚本直接用 Bun；安装依赖由 bootstrap 选择固定 pnpm 包，绕开系统 shim。
[tools]
bun = "1.4.4"

[tasks.install]
description = "Install root workspace dependencies with the pinned pnpm."
run = "mise exec -- bun x --bun --package pnpm@10.33.2 pnpm install"

[tasks.bootstrap]
description = "Install dependencies and build the Web client + mock server (same as bun run bootstrap)."
run = "mise exec -- bun run bootstrap"

[tasks.build]
description = "Build the mock server then the Web client (same as bun run build)."
run = "mise exec -- bun run build"

[tasks.dev]
description = "Start the mock server (:3030) and web client (:5173) dev servers."
run = "mise exec -- bun run dev"

[tasks.typecheck]
description = "Run the root TypeScript project references check."
run = "mise exec -- bun run typecheck"

[tasks.lint]
description = "Run the root linter."
run = "mise exec -- bun run lint"

[tasks.clean]
description = "Remove build outputs (dist + *.tsbuildinfo) only (same as bun run clean)."
run = "mise exec -- bun run clean"

[tasks.clean-deps]
description = "Remove build outputs and node_modules for a clean reinstall (same as bun run clean:deps)."
run = "mise exec -- bun run clean:deps"
