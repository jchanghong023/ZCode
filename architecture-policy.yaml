  - id: session-tool-presentation
    roots: [packages/ui/src/ToolCallBlocks/session]
    managed: true
    requires: [ui]
    publicEntrypoints: [packages/ui/src/ToolCallBlocks/session/contract.ts]
    layers: { ui: "." }
    owner: conversation
  # extension-host-protocol：扩展进程三方共用的纯 schema、类型与纯函数（docs/plugins/extension-host.md §4）。
  - id: extension-host-protocol
    roots:
      - packages/shared/src/extension-host
    managed: true
    # 能力表引用 context 组成的线格式与模型选择 schema（docs/plugins/extension-host.md §7.2、§9）；
    # composer.mention 的候选项与 CLI plugins/mentionItems 共用一份 schema（§16.6）；
    # 会话能力的入参与返回直接用 session-control 的端口 schema（§17.3）。
    requires: [context-composition, plugin-host-queries, session-control, shared]
    publicEntrypoints:
      - packages/shared/src/extension-host/index.ts
      - packages/shared/src/extension-host/contract.ts
    layers:
      domain: .
    owner: plugin
  # extensions-service：Window Host 的扩展门面与能力网关（docs/plugins/extension-host.md §3.5）。
  - id: extensions-service
    roots:
      - packages/services/src/extensions
    managed: true
    requires:
      - extension-host-protocol
      # 扩展视图复用 MCP App 的沙箱句柄与 HTML 挑选（§8）。
      - mcp-apps-protocol
      - plugin-ui-bridge
      # settings 能力用 Window Host 进程内的 plugins/readUserOptions 读取器（§16.7）。
      - plugin-host-queries
      - session-control
      # 插件项目（§17.4）：只经 IProjectService 的 readProjects / saveProject，不碰项目库。
      - project
      - rpc
      - services
      - shared
    publicEntrypoints:
      [packages/services/src/extensions/index.ts, packages/services/src/extensions/contract.ts]
    layers:
      app: .
    owner: plugin
  # extension-host：全 App 唯一的扩展进程与 Main 侧监管器（docs/plugins/extension-host.md §12.1）。
  # extension-slots：Renderer 的贡献表快照、插槽组件（docs/plugins/extension-host.md §6）。
  - id: extension-slots
    roots:
      - packages/ui/src/extension-slots
    managed: true
    requires:
      - extension-host-protocol
      # 扩展视图页面复用 MCP App 的沙箱句柄、握手常量与页面原语（docs/plugins/extension-host.md §8）。
      - mcp-apps-protocol
      - plugin-ui
      - services
      - shared
      - ui
    publicEntrypoints:
      - packages/ui/src/extension-slots/index.ts
      - packages/ui/src/extension-slots/contract.ts
    layers:
      domain: domain
      app: app
      adapters: adapters
      ui: components
    layerOrder: [domain, app, adapters, ui]
    owner: plugin

  # plugin-api：插件作者用的类型包 @zcode-dev/plugin-api（docs/plugins/extension-host.md §17.9）。
  # 只转出 extension-host-protocol 与 v4 协议（shared）的类型；四个子入口都是公开入口。
  # tsup.config.ts 与 scripts/ 产出仓库外用的 dist 声明。
  # 选区批注输入浮层；调用方是 v4 选区浮层，引用数据仍归 ui lib。
  - id: selection-comment
    roots:
