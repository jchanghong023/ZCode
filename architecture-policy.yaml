    paths: [packages/ui/src/v4/conversationTurnRenderUnitTypes.ts]
    reason: 已入库的渲染单元类型只更新 workSegments 字段注释，使其与同一 drain 边界的 guide 共用一段的行为一致；类型与 ui 模块边界不变，接管整个 v4 目录不在本次范围内。
