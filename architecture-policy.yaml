version: 1

# 原因：纯 Web 裁撤后只登记现存路径；有源码的受管模块补齐真实治理产物，
# 裁撤后已无源码与消费者的退役模块撤销登记（见 docs/architecture/pure-web-module-ownership.md），
# 不降低 managed 状态、不以空壳产物消账。
modules:
  - id: session-control
    roots: [packages/session-control/src, packages/session-control/vitest.config.ts]
    managed: true
    requires: []
    publicEntrypoints:
      - packages/session-control/src/contract.ts
      - packages/session-control/src/application/cli/index.ts
      - packages/session-control/src/application/app/index.ts
      - packages/session-control/src/testing/index.ts
    layers: { contract: contract, domain: domain, app: application }
    owner: conversation
  - id: app-control-protocol
    roots: [packages/shared/src/app-control]
    managed: true
    requires: [session-control]
    publicEntrypoints:
      - packages/shared/src/app-control/index.ts
      - packages/shared/src/app-control/contract.ts
    layers: { contract: . }
    owner: conversation
  - id: rpc
    roots: [packages/rpc/src]
    managed: false
  - id: shared
    roots: [packages/shared/src]
    managed: false
  - id: model-option-map
    roots: [packages/model-option-map/src]
    managed: false
  - id: workspace-hooks
    roots: [packages/shared/src/workspace-hooks]
    managed: true
    requires: []
    publicEntrypoints: [packages/shared/src/workspace-hooks/contract.ts]
    layers: { contract: . }
    owner: hooks
  - id: provider
    roots: [packages/provider/src]
    managed: false
  - id: services
    roots: [packages/services/src]
    managed: false
  - id: session
    roots: [packages/services/src/session]
    managed: false
    requires: [shared]
    publicEntrypoints: []
    owner: conversation
  - id: storage
    roots: [packages/services/src/storage]
    managed: true
    requires: [shared, rpc, services]
    publicEntrypoints: [packages/services/src/storage/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: desktop-settings
  - id: client
    roots: [packages/client/src]
    managed: false
  - id: server
    roots: [packages/server/src]
    managed: false
  # mock-domains：纯 Web 模拟后端的领域装配层，权威状态仍由 server 的 MockRuntime 持有。
  - id: mock-domains
    roots: [packages/server/src/mock/domains]
    managed: true
    requires: [services, shared, rpc, server]
    publicEntrypoints:
      - packages/server/src/mock/domains/contract.ts
    layers: { adapters: . }
    owner: runtime
  - id: document-highlighting
    roots: [packages/ui/src/document-highlighting]
    managed: true
    requires: []
    publicEntrypoints:
      - packages/ui/src/document-highlighting/index.ts
      - packages/ui/src/document-highlighting/contract.ts
      - packages/ui/src/document-highlighting/bundle.ts
    layers: { app: . }
    owner: requirements
  - id: ui
    roots: [packages/ui/src]
    managed: false
  - id: web
    roots: [packages/web/src]
    managed: false
  # design-runtime：网页元素上下文的共享类型与页面 inspector 表达式。
  - id: design-runtime
    roots: [packages/design-runtime/src]
    managed: true
    requires: []
    publicEntrypoints:
      - packages/design-runtime/src/index.ts
      - packages/design-runtime/src/contract.ts
    layers: { app: "." }
    owner: conversation
  # sqlite-migrations：由 architecture:adopt 登记
  # Agent runtime 退出诊断：desktop 稳定性上报与 Host 退出提示共用的纯函数判定。
  - id: agent-crash-diagnostic
    roots: [packages/shared/src/agent-crash-diagnostic]
    managed: true
    requires: []
    publicEntrypoints:
      - packages/shared/src/agent-crash-diagnostic/index.ts
      - packages/shared/src/agent-crash-diagnostic/contract.ts
    layers: { app: "." }
    owner: desktop
  - id: conversation-telemetry-engine
    roots: [packages/shared/src/conversation-telemetry]
    managed: true
    requires: [shared]
    publicEntrypoints:
      - packages/shared/src/conversation-telemetry/index.ts
      - packages/shared/src/conversation-telemetry/contract.ts
      - packages/shared/src/conversation-telemetry/messageTelemetry.ts
      - packages/shared/src/conversation-telemetry/providerTelemetryIdentity.ts
      - packages/shared/src/conversation-telemetry/remoteTelemetryEvent.ts
    layers: { app: "." }
    owner: conversation
  - id: conversation-telemetry-service
    roots: [packages/services/src/conversation-telemetry]
    managed: true
    requires: [shared, services, rpc, conversation-telemetry-engine]
    publicEntrypoints: [packages/services/src/conversation-telemetry/contract.ts]
    layers: { app: "." }
    owner: conversation
  - id: sqlite-migrations
    roots:
      - packages/shared/src/sqlite-migrations
    managed: true
    requires: []
    publicEntrypoints:
      - packages/shared/src/sqlite-migrations/index.ts
      - packages/shared/src/sqlite-migrations/contract.ts
    layers:
      adapters: .
    owner: persistence
  # project-storage：由 architecture:adopt 登记
  - id: project-storage
    roots: [packages/services/src/project-storage]
    managed: true
    requires:
      - shared
      - sqlite-migrations
      - services
      - session
      - task-groups
    publicEntrypoints:
      [
        packages/services/src/project-storage/contract.ts,
        packages/services/src/project-storage/repository-contract.ts,
      ]
    layers:
      adapters: .
    owner: conversation
  # project：由 architecture:adopt 登记
  - id: project
    roots:
      - packages/services/src/project
    managed: true
    requires: [project-storage, services, shared]
    publicEntrypoints: [packages/services/src/project/contract.ts]
    layers:
      adapters: .
    owner: conversation
  # project-sidebar：保留纯展示与派生资产；旧窗口目录和任务操作消费者已删除。
  - id: project-sidebar
    roots: [packages/ui/src/project-sidebar]
    managed: true
    requires:
      - services
      - shared
      - ui
      - conversation-workspace-target
      - managed-worktree-ui
      - task-row-hover
    publicEntrypoints:
      - packages/ui/src/project-sidebar/index.tsx
      - packages/ui/src/project-sidebar/contract.ts
      - packages/ui/src/project-sidebar/WorkspaceDragOverlay.tsx
    layers:
      contract: contract.ts
      ui: .
    owner: conversation
  # remote-projects：由 architecture:adopt 登记
  # workspace-config-catalog：由 architecture:adopt 登记
  - id: workspace-config-catalog
    roots:
      - packages/ui/src/workspace-config-catalog
    managed: true
    requires: [services, shared, ui]
    publicEntrypoints:
      - packages/ui/src/workspace-config-catalog/index.ts
      - packages/ui/src/workspace-config-catalog/contract.ts
    layers:
      contract: contract.ts
      app: catalog.ts
      ui: .
    owner: configuration
  # project-catalog：由 architecture:adopt 登记
  - id: project-catalog
    roots:
      - packages/services/src/project-catalog
    managed: true
    requires: [project]
    publicEntrypoints:
      - packages/services/src/project-catalog/index.ts
      - packages/services/src/project-catalog/contract.ts
    layers:
      contract: contract.ts
      domain: selection-id.ts
      app: .
    owner: conversation
  # conversation-workspace-target：由 architecture:adopt 登记
  - id: conversation-workspace-target
    roots:
      - packages/ui/src/conversation-workspace-target
    managed: true
    requires: [shared, ui]
    publicEntrypoints:
      - packages/ui/src/conversation-workspace-target/index.ts
      - packages/ui/src/conversation-workspace-target/contract.ts
      - packages/ui/src/conversation-workspace-target/purpose.ts
      - packages/ui/src/conversation-workspace-target/sourceIdentity.ts
      - packages/ui/src/conversation-workspace-target/workbenchTarget.ts
    layers:
      contract: contract.ts
      app: .
    owner: conversation

  - id: gen-ui-protocol
    roots: [packages/shared/src/gen-ui]
    managed: true
    requires: []
    publicEntrypoints: [packages/shared/src/gen-ui/index.ts, packages/shared/src/gen-ui/contract.ts]
    layers: { domain: "." }
    owner: conversation
  - id: gen-ui-service
    roots: [packages/services/src/gen-ui]
    managed: true
    requires: [services, shared, rpc, gen-ui-protocol, mcp-apps-protocol]
    publicEntrypoints: [packages/services/src/gen-ui/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: conversation

  - id: gen-ui
    roots: [packages/ui/src/gen-ui]
    managed: true
    requires: [ui, gen-ui-protocol]
    publicEntrypoints:
      - packages/ui/src/gen-ui/index.ts
      - packages/ui/src/gen-ui/contract.ts
    layers: { domain: "." }
    owner: conversation

  # 插件 UI（MCP Apps 沙箱）：模块边界见各模块 CONTRACT.md。
  - id: mcp-apps-protocol
    roots: [packages/shared/src/mcp-apps]
    managed: true
    requires: []
    publicEntrypoints:
      [
        packages/shared/src/mcp-apps/index.ts,
        packages/shared/src/mcp-apps/contract.ts,
        packages/shared/src/mcp-apps/hostContract.ts,
      ]
    layers:
      domain: "."
    owner: plugin
  # host-database-startup：由 architecture:adopt 登记
  # cli-subagent-config：由 architecture:adopt 登记
  # cli-session-execution：由 architecture:adopt 登记

  # 保留既有源码位置；精确登记源文件，不扩大到整个 CLI 或 handlers 目录。

  # remote-input-prediction：仅保留 v4 输入预测 schema；无服务侧开关或当前 RPC 能力承诺。
  - id: remote-input-prediction
    roots: [packages/shared/src/zcode-protocol-v4/input-prediction]
    managed: true
    requires: [shared]
    publicEntrypoints: [packages/shared/src/zcode-protocol-v4/input-prediction/contract.ts]
    layers: { app: . }
    owner: remote
  # context-composition：保留 context 组成的纯 v4 线格式；旧查询／通知客户端已裁撤。
  - id: context-composition
    roots: [packages/shared/src/zcode-protocol-v4/context-composition]
    managed: true
    requires: [shared]
    publicEntrypoints: [packages/shared/src/zcode-protocol-v4/context-composition/contract.ts]
    layers: { app: . }
    owner: agent
  # plugin-host-queries：保留插件查询纯 schema；不登记已裁撤的 services 客户端。
  - id: plugin-host-queries
    roots: [packages/shared/src/zcode-protocol/plugin-host-queries]
    managed: true
    requires: []
    publicEntrypoints: [packages/shared/src/zcode-protocol/plugin-host-queries/contract.ts]
    layers: { app: . }
    owner: plugin
  # 仅保留原生 v4 历史载荷的插件 schema，不提供安装交互或插件运行能力。
  - id: plugin-install-interaction
    roots:
      - packages/shared/src/plugin-discovery
      - packages/shared/src/plugin-store-visibility.ts
      - packages/shared/src/zcode-protocol-v4/pluginInstall.ts
    managed: true
    requires: [shared]
    publicEntrypoints:
      - packages/shared/src/plugin-discovery/contract.ts
      - packages/shared/src/plugin-store-visibility.ts
      - packages/shared/src/zcode-protocol-v4/pluginInstall.ts
    layers: { app: . }
    owner: plugin
  # node-repl-call-ledger：node_repl 结果里可信事实的唯一来源（apps/zcode-cli/docs/design/v2/tool/20-node-repl-call-ledger.md）
  # topic-resource-tool：ReadSessionContext(topic, attachment) 拆出的话题资源工具（会话工具设计 0.8）。
  # composer-toolbar-layout：登记既有 DOM 布局入口，不改调用路径。
  - id: composer-toolbar-layout
    roots:
      [
        packages/ui/src/composer-toolbar-layout,
        packages/ui/src/prompt-editor/useComposerToolbarFit.ts,
      ]
    managed: true
    requires: []
    publicEntrypoints:
      - packages/ui/src/prompt-editor/useComposerToolbarFit.ts
      - packages/ui/src/composer-toolbar-layout/contract.ts
    layers: { ui: . }
    owner: conversation

  # task-groups：由 architecture:adopt 登记
  - id: task-groups
    roots:
      - packages/services/src/task-groups
    managed: true
    requires:
      - services
      - session
      - shared
    publicEntrypoints: [packages/services/src/task-groups/contract.ts]
    layers:
      adapters: .
    owner: conversation


  # office-runtime：内置文档插件查看面板的共享运行时，由 architecture:adopt 登记

  # data-sync-service：仅保留 MCP 依赖的通用分类合同；无用户配置或设备状态 RPC。
  - id: data-sync-service
    roots:
      - packages/services/src/data-sync
    managed: true
    requires:
      - services
      - shared
    publicEntrypoints:
      [packages/services/src/data-sync/index.ts, packages/services/src/data-sync/contract.ts]
    layers:
      app: .
    owner: remote
  # voice-input：Composer 语音输入按钮、状态机与麦克风采集（docs/chat/composer-voice-input.md）
  # settings-scope：设置页 Scope 菜单按设备分组（docs/remote/data-sync.md「Scope 菜单按设备分组」）
  - id: settings-scope
    roots:
      - packages/ui/src/settings-scope
    managed: true
    requires:
      - services
      - shared
      - ui
      - conversation-workspace-target
      - workspace-config-catalog
    publicEntrypoints:
      - packages/ui/src/settings-scope/index.ts
      - packages/ui/src/settings-scope/contract.ts
    layers:
      contract: contract.ts
      domain: domain
      app: app
      ui: .
    layerOrder: [contract, domain, app, ui]
    owner: remote
  # side-pane-full-view：由 architecture:adopt 登记
  - id: side-pane-full-view
    roots:
      - packages/ui/src/side-pane-full-view
    managed: true
    requires:
      - shared
      - ui
    publicEntrypoints:
      - packages/ui/src/side-pane-full-view/index.ts
      - packages/ui/src/side-pane-full-view/contract.ts
    layers:
      ui: .
    owner: conversation

  # 发行策略使用独立目录；修改后的文件由本模块承担边界检查。
  - id: request-security-edition
    roots: [packages/shared/src/request-security-edition]
    managed: true
    requires: [shared]
    publicEntrypoints:
      - packages/shared/src/request-security-edition/index.ts
      - packages/shared/src/request-security-edition/policy.ts
      - packages/shared/src/request-security-edition/verification-policy.ts
      - packages/shared/src/request-security-edition/contract.ts
    layers: { adapters: . }
    owner: request-security

  # local-ttft-contract：由 architecture:adopt 登记
  - id: local-ttft-contract
    roots:
      - packages/shared/src/local-ttft
    managed: true
    requires: []
    publicEntrypoints:
      - packages/shared/src/local-ttft/contract.ts
    layers:
      contract: .
  # local-ttft-renderer：由 architecture:adopt 登记
  - id: local-ttft-renderer
    roots:
      - packages/ui/src/v4/telemetry/local-ttft
    managed: true
    requires:
      - shared
      - ui
    publicEntrypoints:
      - packages/ui/src/v4/telemetry/local-ttft/contract.ts
    layers:
      ui: .
  # local-ttft-desktop：由 architecture:adopt 登记
  # local-ttft-cli：由 architecture:adopt 登记
  # cli-official-command-endpoint：由 architecture:adopt 登记
  # zcode-site-panel：zcode-site 插件自带的 Sites 面板（MCP server + 页面），由 architecture:adopt 登记

  # file-open-apps：由 architecture:adopt 登记
  # ui-file-menu：由 architecture:adopt 登记
  - id: ui-file-menu
    roots:
      - packages/ui/src/file-menu
    managed: true
    requires:
      - shared
      - ui
    publicEntrypoints:
      - packages/ui/src/file-menu/index.ts
      - packages/ui/src/file-menu/contract.ts
    layers:
      ui: .
    owner: file-preview

  # web-platform：由 architecture:adopt 登记
  - id: web-platform
    roots:
      - packages/web/src/platform
    managed: true
    requires:
      - shared
      - ui
      - web
    publicEntrypoints:
      - packages/web/src/platform/index.ts
      - packages/web/src/platform/contract.ts
    layers:
      adapters: .
    owner: web

  # image-preview-editor：由 architecture:adopt 登记
  - id: image-preview-editor
    roots:
      - packages/ui/src/image-preview-editor
      - packages/ui/src/hooks/useImageFilePreview.ts
      - packages/ui/src/lib/copyPreviewImage.ts
      - packages/ui/src/lib/imagePreviewDownload.ts
      - packages/ui/src/v4/ConversationImageFileMention.tsx
    managed: true
    requires: [ui, shared, ui-file-menu]
    publicEntrypoints:
      - packages/ui/src/image-preview-editor/index.ts
      - packages/ui/src/image-preview-editor/contract.ts
      - packages/ui/src/hooks/useImageFilePreview.ts
      - packages/ui/src/lib/copyPreviewImage.ts
      - packages/ui/src/lib/imagePreviewDownload.ts
      - packages/ui/src/v4/ConversationImageFileMention.tsx
    layers:
      ui: .
    owner: conversation
  # 用户消息正文组合；保留现有 v4 入口，以精确 root 登记展示层归属。
  - id: conversation-user-input-presentation
    roots:
      - packages/ui/src/conversation-user-input-presentation
      - packages/ui/src/v4/ConversationUserInputBubble.tsx
    managed: true
    requires: [ui, shared, image-preview-editor]
    publicEntrypoints:
      - packages/ui/src/conversation-user-input-presentation/contract.ts
      - packages/ui/src/v4/ConversationUserInputBubble.tsx
    layers:
      ui: .
    owner: conversation

  # protocol-session-data：由 architecture:adopt 登记
  - id: protocol-session-data
    roots:
      - packages/shared/src/zcode-protocol-v4/session-data
    managed: true
    requires: []
    publicEntrypoints:
      - packages/shared/src/zcode-protocol-v4/session-data/index.ts
      - packages/shared/src/zcode-protocol-v4/session-data/contract.ts
    layers:
      domain: .
  # cli-session-data-files：由 architecture:adopt 登记
  # cli-session-data：由 architecture:adopt 登记

  # session-lifecycle：由 architecture:adopt 登记
  # workspace-mcp-trust：由 architecture:adopt 登记
  # composer-edit-mode：由 architecture:adopt 登记
  - id: composer-edit-mode
    roots:
      - packages/ui/src/composer-edit-mode
    managed: true
    requires: [shared, ui]
    publicEntrypoints:
      - packages/ui/src/composer-edit-mode/index.ts
      - packages/ui/src/composer-edit-mode/contract.ts
    layers:
      contract: contract.ts
      ui: .
    owner: conversation
  # desktop-microphone-access：由 architecture:adopt 登记
  # web-share-manage：由 architecture:adopt 登记
  # managed-worktree-shared：由 architecture:adopt 登记
  - id: managed-worktree-shared
    roots:
      - packages/shared/src/managed-worktree
    managed: true
    requires: []
    publicEntrypoints:
      - packages/shared/src/managed-worktree/index.ts
      - packages/shared/src/managed-worktree/contract.ts
    layers:
      app: .
    owner: desktop
  # managed-worktree-tasks：只管理通用 worktree 展示所需 DTO，不提供服务或 descriptor。
  - id: managed-worktree-tasks
    roots: [packages/services/src/managed-worktree-tasks]
    managed: true
    requires: [shared]
    publicEntrypoints: [packages/services/src/managed-worktree-tasks/contract.ts]
    layers: { app: . }
    owner: desktop
  # managed-worktree-ui：由 architecture:adopt 登记
  - id: managed-worktree-ui
    roots:
      - packages/ui/src/managed-worktrees
    managed: true
    requires:
      - services
      - shared
      - ui
      - conversation-user-input-presentation
    publicEntrypoints:
      - packages/ui/src/managed-worktrees/index.ts
      - packages/ui/src/managed-worktrees/contract.ts
    layers:
      contract: contract.ts
      ui: .
    owner: desktop

  - id: session-tool-presentation
    roots: [packages/ui/src/ToolCallBlocks/session]
    managed: true
    requires: [ui]
    publicEntrypoints: [packages/ui/src/ToolCallBlocks/session/contract.ts]
    layers: { ui: "." }
    owner: conversation
  # extension-host-protocol：扩展进程三方共用的纯 schema、类型与纯函数（docs/plugins/extension-host.md §4）。
  - id: extension-host-protocol
    roots:
      - packages/shared/src/extension-host
    managed: true
    # 能力表引用 context 组成的线格式与模型选择 schema（docs/plugins/extension-host.md §7.2、§9）；
    # composer.mention 的候选项与 CLI plugins/mentionItems 共用一份 schema（§16.6）；
    # 会话能力的入参与返回直接用 session-control 的端口 schema（§17.3）。
    requires: [context-composition, plugin-host-queries, session-control, shared]
    publicEntrypoints:
      - packages/shared/src/extension-host/index.ts
      - packages/shared/src/extension-host/contract.ts
    layers:
      domain: .
    owner: plugin
  # 选区批注输入浮层；调用方是 v4 选区浮层，引用数据仍归 ui lib。
  - id: selection-comment
    roots:
      - packages/ui/src/selection-comment
    managed: true
    requires:
      - ui
    publicEntrypoints:
      - packages/ui/src/selection-comment/index.ts
      - packages/ui/src/selection-comment/contract.ts
    layers:
      ui: .
    owner: conversation

  # browser-employee-entry：复用退役产品认证目录，唯一 owner 为浏览器标签页。
  - id: browser-employee-entry
    roots:
      - packages/web/src/auth
    managed: true
    requires:
      - ui
    publicEntrypoints:
      - packages/web/src/auth/index.ts
      - packages/web/src/auth/contract.ts
    layers:
      app: .
    owner: identity

  - id: credential-security
    roots:
      - packages/shared/src/credential-security
    managed: true
    requires: [shared]
    publicEntrypoints:
      - packages/shared/src/credential-security/module.ts
      - packages/shared/src/credential-security/contract.ts
    layers:
      adapters: .
    owner: authentication

  # settings-search：由 architecture:adopt 登记
  - id: settings-search
    roots:
      - packages/ui/src/settings-search
    managed: true
    requires:
      - ui
    publicEntrypoints:
      - packages/ui/src/settings-search/index.ts
      - packages/ui/src/settings-search/contract.ts
    layers:
      ui: .
    owner: settings
  # task-row-hover：会话行悬停卡片（docs/ui/task-row-hover-details.md）
  - id: task-row-hover
    roots:
      - packages/ui/src/task-row-hover
    managed: true
    requires:
      - managed-worktree-ui
      - shared
      - ui
    publicEntrypoints:
      - packages/ui/src/task-row-hover/index.ts
      - packages/ui/src/task-row-hover/contract.ts
    layers:
      ui: .
    owner: conversation

  # cli-memory-diagnostics：由 architecture:adopt 登记
  - id: mobile-ui
    roots: [packages/ui/src/components/mobile-ui]
    managed: true
    requires: [ui]
    publicEntrypoints:
      - packages/ui/src/components/mobile-ui/index.ts
      - packages/ui/src/components/mobile-ui/contract.ts
    layers: { ui: . }
    owner: ui
  # aireq-contract：由 architecture:adopt 登记
  - id: aireq-contract
    roots:
      - packages/services/src/aireq
    managed: true
    requires: [services, shared, rpc]
    publicEntrypoints:
      - packages/services/src/aireq/index.ts
      - packages/services/src/aireq/contract.ts
    layers:
      app: .
    owner: requirements
  # aireq-mock：由 architecture:adopt 登记
  - id: aireq-mock
    roots:
      - packages/server/src/aireq
    managed: true
    requires: [aireq-contract, services, shared, rpc]
    publicEntrypoints:
      - packages/server/src/aireq/contract.ts
    layers:
      adapters: .
    owner: requirements
  # aireq-ui：由 architecture:adopt 登记
  - id: aireq-ui
    roots:
      - packages/ui/src/aireq
    managed: true
    requires: [aireq-contract, services, shared, ui, settings-search]
    publicEntrypoints:
      - packages/ui/src/aireq/index.ts
      - packages/ui/src/aireq/contract.ts
    layers:
      contract: contract.ts
      ui: .
    owner: requirements

global:
  # 临时时间戳（2026-09-10）：unmanaged-new-file 只约束此日期之后首次入库的文件。
  # 基于领先 staging 很多的分支开工时，merge-base 之前的"新增"文件不应被追溯。
  newFilesEnforcedSince: "2026-09-10"
  acceptedUpstreamCommits: []
  maxFileLines: 800
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true
  acceptedUpstreamSnapshot: scripts/architecture/upstream-snapshot.json
  # 浏览器公共面包含每个包的全部安全子入口；Node 专用入口显式排除，不能由 baseline 放行。
  browserScopes: [packages/ui/src, packages/web/src, packages/client/src]
  browserPackages:
    - "@zcode/ui"
    - "@zcode/client"
    - "@zcode/shared"
    - "@zcode/services"
    - "@zcode/rpc"
    - "@zcode/provider"
    - "@zcode/model-option-map"
    - "@zcode/session-control"
    - "@zcode/design-runtime"
  nodeEntrypoints:
    - "@zcode/shared/node"
    - "@zcode/shared/agent-crash-diagnostic"
    - "@zcode/shared/sqlite-migrations"
    - "@zcode/shared/managed-worktree"
    - "@zcode/shared/workspace-hook-discovery"
    - "@zcode/shared/workspace-hook-mutation"
  nativePackages: ["@napi-rs/keyring"]

exceptions:
  - id: storage-startup-gate-browser-uuid-existing-edit
    rule: unmanaged-new-file
    paths: [packages/services/src/zcode-agent/zcodeStorageStartupGate.ts]
    reason: 既有协议启动门禁只将 Node randomUUID 替换为 shared 跨端 UUID 工具，移除浏览器契约的传递 Node 依赖；不新增文件，不改变状态 owner、订阅或超时顺序。整个 services 目录接管不在本次 P0 范围，此精确准入不豁免浏览器安全规则。
  - id: mock-project-service-split
    rule: unmanaged-new-file
    paths: [packages/server/src/mock/project.ts]
    reason: 纯 Web 模拟后端把本地项目与目录浏览从 planning.ts 拆出以满足 max-lines；server 为原型模块，后续由自有后端整体替换时一并删除。
  - id: removed-tool-grouping-action-catalog
    rule: unmanaged-new-file
    paths: [packages/ui/src/lib/userActionTraceCatalog.ts]
    reason: 上游已有埋点目录仅删除已移除分组选项的三个事件声明；本次不接管整个 UI lib 目录。
  - id: conversation-selection-comment-quote-schema-edit
    rule: unmanaged-new-file
    paths: [packages/shared/src/conversationSelection.ts]
    reason: 已准入的对话引用 schema 只追加可选 comment 与 agent 字段（选区批注，docs/ui/conversation-selection-side-chat.md「选区批注」）；仍是 conversationQuotes 的唯一 schema，长度上限与模块边界不变，接管整个 shared 包不在本次范围内。
  - id: side-pane-full-view-shortcut-command-edit
    rule: unmanaged-new-file
    paths: [packages/shared/src/shortcutCommands.ts]
    reason: 已准入的快捷键命令表只追加一条 toggleSidePaneFullView 命令（Side Pane 完整视图，docs/ui/side-pane-full-view.md）；命令表仍是唯一数据源，签名与模块边界不变，接管整个 shared 包不在本次范围内。
  - id: project-location-cache-recovery-existing-edit
    rule: unmanaged-new-file
    paths:
      [
        packages/shared/src/project-access-token.ts,
        packages/shared/src/project-access-token-client.ts,
      ]
    reason: 已有项目 Token 与凭据存储增加派生缓存的局部恢复端口，并把换证请求失败按固定类别分码（ZCT-2111046389485834240）；已确认的 PAT 签发临时故障仅在原 pending 内重试一次，不扩展到 Key 创建或 OAuth；保持原有 owner 和共享文件锁，不接管全目录。
  - id: plugin-agent-permission-mode-restrict-only-existing-edit
    rule: unmanaged-new-file
    paths:
      - packages/shared/src/subagent-profile.ts
      - packages/shared/src/subagent-profile-parser.ts
    reason: 已准入的存量文件为插件 agent 的 permissionMode 只能收紧（ZP-20261028-13）增加进程内 profile 标记字段并更新注释；跨进程 schema 与解析行为不变，接管 shared 目录不在本次范围内。
  - id: test-ids-subpath-import-unmanaged-edit
